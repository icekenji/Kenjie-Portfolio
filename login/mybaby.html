<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Mybaby</title>
<link rel="stylesheet" href="mybaby.css">
</head>
<body>

<div class="login-box">
  <h2>User Login - My Baby</h2>
  <p class="clue">
    USERNAME: Month | PASSWORD: DATE
  </p>

  <div class="input-group">
    <input type="text" id="username" placeholder="Username">
  </div>

  <div class="input-group">
    <input type="password" id="password" placeholder="Password">
  </div>

  <button onclick="login()">Login</button>

  <p id="error-message"></p>
</div>

<script>
function login() {
  const user = document.getElementById("username").value.trim().toLowerCase();
  const pass = document.getElementById("password").value.trim().toLowerCase();

  const correctUser = "November";
  const correctPass = "16";

  if (user === correctUser.toLowerCase() && 
      pass === correctPass.toLowerCase()) {
    
    window.location.href = "../dashboard/dashboard.html";
    
  } else {
    document.getElementById("error-message").textContent =
      "Invalid username or password";
  }
}
</script>
